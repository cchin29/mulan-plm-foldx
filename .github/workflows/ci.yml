name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Naming any scope sets every unnamed one to none; reading the tree is all these jobs do.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every minor from the declared floor (requires-python >= 3.9) to the newest one torch
        # ships wheels for, with no gaps: a version that is not in the matrix is a version
        # nothing checks. 3.9 was verified by hand first (2026-09-10, 3.9.25: 163 tests, both
        # verifiers, the repair-ablation snippet, all five CLIs).
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      # Actions pinned by commit SHA rather than by a mutable major tag; the comment names
      # the release the SHA was taken from (resolved 2026-09-09).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        # torch CPU wheels only -- the suite never runs a model forward pass, and the default
        # wheel pulls ~2.5 GB of CUDA that CI has no use for.
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          # skempi-foldx -- this repo's FoldX producer half, split out to its own project (MIT
          # code, CC BY 4.0 energies) -- is pulled in by pyproject.toml as a git URL. It IS on
          # PyPI, but only from 0.2.2, and this pin is v0.1.0, which predates that first upload --
          # so there is no `skempi-foldx==0.1.0` to resolve and the tag is the only way to name it.
          # The repository is public, so this resolves anonymously and reproducibly; no pre-install
          # or fallback is needed.
          pip install -e ".[dev]"

      - name: Tests
        run: pytest tests/ -q

      - name: Metric selftest against scipy/sklearn
        # The metric bodies are numpy-only by design; this checks them against the reference
        # implementations to 1e-9 rather than trusting that they stayed equivalent.
        run: |
          pip install scipy scikit-learn
          python experiments/rescore_perstructure/rescore.py --selftest

  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: No machine-specific paths or host identifiers
        # Absolute paths and host identifiers are machine-specific and must not ship.
        run: |
          set -e
          # A bare dotted-quad also matches DOIs (10.1101/2024.08.24.609515), so match the
          # shape a leak takes -- an ssh target -- rather than any four numbers.
          # Match the shape of a home directory rather than any one username, so the check does
          # not depend on which machine a path came from.
          patterns='/Users/[a-z]|/home/[a-z]|/private/tmp/|/sessions/|@[0-9]{1,3}(\.[0-9]{1,3}){3}|ssh +[a-z0-9_-]+@|SynologyDrive'
          # /sessions/ catches sandbox paths, which carry a unique per-session id.
          # ~/.venvs and ~/miniforge3 are deliberately NOT matched: they are documented venv
          # conventions carrying no username or machine identity, and matching them fails CI on
          # ~29 lines of legitimate setup instructions.
          # --exclude-dir=.github: this file necessarily contains the patterns it searches for.
          # The include list covers every tracked text type, not just source, and names the
          # extensionless files (NOTICE, LICENSE, MANIFEST.sha256) explicitly: the tree ships
          # ~1180 .json, ~810 .tsv, ~75 .csv and ~23 .html files, and a path embedded in an
          # inline data blob (experiments/rescore_perstructure/foldx_alone_baseline.html carries
          # one) would otherwise never be looked at.
          if grep -rInE "$patterns" --include='*.py' --include='*.sh' --include='*.md' \
                 --include='*.toml' --include='*.yml' --include='*.json' --include='*.tsv' \
                 --include='*.csv' --include='*.html' --include='*.css' --include='*.js' \
                 --include='*.mjs' --include='*.txt' --include='*.cff' --include='*.fasta' \
                 --include='NOTICE' --include='LICENSE' --include='*.sha256' \
                 --exclude-dir=.github . ; then
            echo "::error::machine-specific path or host identifier found"
            exit 1
          fi
          echo "clean"
